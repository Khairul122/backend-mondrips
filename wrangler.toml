name = "backend-mondrips"
main = "src/index.ts"
compatibility_date = "2025-02-18"

[[d1_databases]]
binding = "DB"
database_name = "db_mondrips"
database_id = "f1d67084-d9a8-43d2-ad43-cbc37ddfc24a"

[vars]
JWT_EXPIRES_IN = "1h"
REMEMBER_TOKEN_EXPIRES_IN = "30d"
NODE_ENV = "production"
CORS_ORIGINS = "http://localhost:3000,http://localhost:5173,http://localhost:5174,https://backend-mondrips-production.mondrips-api.workers.dev,https://mondrips.com,*.mondrips.com"

[env.production]
name = "backend-mondrips-production"
compatibility_date = "2025-02-18"

[[env.production.d1_databases]]
binding = "DB"
database_name = "db_mondrips"
database_id = "f1d67084-d9a8-43d2-ad43-cbc37ddfc24a"

[env.production.vars]
JWT_EXPIRES_IN = "1h"
REMEMBER_TOKEN_EXPIRES_IN = "30d"
NODE_ENV = "production"
CORS_ORIGINS = "http://localhost:3000,http://localhost:5173,http://localhost:5174,https://backend-mondrips-production.mondrips-api.workers.dev,https://mondrips.com,*.mondrips.com"

[env.staging]
name = "backend-mondrips-staging"
compatibility_date = "2025-02-18"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "db_mondrips"
database_id = "f1d67084-d9a8-43d2-ad43-cbc37ddfc24a"

[[env.staging.r2_buckets]]
binding = "UPLOADS"
bucket_name = "mondrips-uploads"

[env.staging.vars]
JWT_EXPIRES_IN = "1h"
REMEMBER_TOKEN_EXPIRES_IN = "30d"
NODE_ENV = "staging"
CORS_ORIGINS = "http://localhost:3000,http://localhost:5173,http://localhost:5174,https://backend-mondrips-production.mondrips-api.workers.dev,https://mondrips.com,*.mondrips.com"
